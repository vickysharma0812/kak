# kak-tree-sitter user config (merged on top of `ktsctl default-config`).
# Loaded via `kak-tree-sitter --config` in kakrc.

# Extra capture groups used by the Fortran queries (appended to the defaults).
# "number" is deliberately NOT listed: the queries tag every `end` as @number,
# which Helix's theme ignores (so `end do` keeps the keyword colour). Leaving it
# out makes KTS ignore it the same way.
[highlight]
groups = ["function.call"]

# Fortran is not in the KTS defaults. Reuse the grammar and queries that Helix
# already built from the tree-sitter-fortran fork, so both editors stay in sync.
# After `hx --grammar build`, nothing needs to be done here.
[grammar.fortran.source.local]
path = "/Users/easifem/.config/helix/runtime/grammars/fortran.so"

[language.fortran.queries.source.local]
path = "/Users/easifem/.config/helix/runtime/queries/fortran"

[language.fortran]
remove_default_highlighter = true

# TOML: also reuse Helix's grammar and queries (KTS would otherwise need
# `ktsctl sync toml`), so TOML looks the same in both editors.
[grammar.toml.source.local]
path = "/Users/easifem/.config/helix/runtime/grammars/toml.so"

[language.toml.queries.source.local]
path = "/Users/easifem/.config/helix/runtime/queries/toml"

# Markdown, as Helix does it: a block grammar (headings, lists, code blocks)
# whose queries inject an inline grammar (bold, italic, code spans, links) into
# each paragraph, and the fence's language into fenced code blocks.
# The block grammar is the one Helix builds; the inline one is not built in
# ~/.config/helix, so it comes from Homebrew's Helix runtime (as in Helix).
[grammar.markdown.source.local]
path = "/Users/easifem/.config/helix/runtime/grammars/markdown.so"

[language.markdown.queries.source.local]
path = "/Users/easifem/.config/helix/runtime/queries/markdown"

[grammar."markdown.inline".source.local]
path = "/opt/homebrew/opt/helix/libexec/runtime/grammars/markdown_inline.so"

[language."markdown.inline".queries.source.local]
path = "/opt/homebrew/opt/helix/libexec/runtime/queries/markdown.inline"
