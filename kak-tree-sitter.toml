# kak-tree-sitter user config (merged on top of `ktsctl default-config`).
# Loaded via `kak-tree-sitter --config` in kakrc.

# Extra capture groups used by the Fortran queries (appended to the defaults).
# "number" is deliberately NOT listed: the queries tag every `end` as @number,
# which Helix's theme ignores (so `end do` keeps the keyword colour). Leaving it
# out makes KTS ignore it the same way.
[highlight]
# "keyword.repeat", "keyword.modifier", "keyword.return": used by the CMake
# queries; their faces fall back to ts_keyword, as Helix does.
groups = ["function.call", "keyword.repeat", "keyword.modifier", "keyword.return"]

# Fortran is not in the KTS defaults. kak has its own grammar and queries in
# tree-sitter/ (Helix still uses its fork). The grammar is upstream
# stadelmanma/tree-sitter-fortran master @ 72f8759 (2026-10-27), built by hand:
#   git -C tree-sitter/sources/fortran pull
#   cd tree-sitter/sources/fortran && cc -O2 -shared -fPIC -I src \
#     src/parser.c src/scanner.c -o ../../grammars/fortran.so
# The queries started as copies of Helix's and were fixed for the new grammar.
[grammar.fortran.source.local]
path = "/home/easifem/.config/kak/tree-sitter/grammars/fortran.so"

[language.fortran.queries.source.local]
path = "/home/easifem/.config/kak/tree-sitter/queries/fortran"

[language.fortran]
remove_default_highlighter = true

# TOML: also reuse Helix's grammar and queries (KTS would otherwise need
# `ktsctl sync toml`), so TOML looks the same in both editors.
[grammar.toml.source.local]
path = "/home/easifem/.config/helix/runtime/grammars/toml.so"

[language.toml.queries.source.local]
path = "/home/easifem/.config/helix/runtime/queries/toml"

# Markdown, as Helix does it: a block grammar (headings, lists, code blocks)
# whose queries inject an inline grammar (bold, italic, code spans, links) into
# each paragraph, and the fence's language into fenced code blocks.
# The block grammar is the one Helix builds; the inline one is not built in
# ~/.config/helix, so it comes from the system Helix runtime (/usr/lib/helix) (as in Helix).
[grammar.markdown.source.local]
path = "/home/easifem/.config/helix/runtime/grammars/markdown.so"

[language.markdown.queries.source.local]
path = "/home/easifem/.config/helix/runtime/queries/markdown"

[grammar."markdown.inline".source.local]
path = "/usr/lib/helix/runtime/grammars/markdown_inline.so"

[language."markdown.inline".queries.source.local]
path = "/usr/lib/helix/runtime/queries/markdown.inline"

# JSON (snippet files): ~/.config/helix/runtime has no JSON grammar, so use
# the system Helix runtime (/usr/lib/helix), as Helix itself does.
[grammar.json.source.local]
path = "/usr/lib/helix/runtime/grammars/json.so"

[language.json.queries.source.local]
path = "/usr/lib/helix/runtime/queries/json"

# CMake: Helix's grammar and queries, as for TOML.
[grammar.cmake.source.local]
path = "/home/easifem/.config/helix/runtime/grammars/cmake.so"

[language.cmake.queries.source.local]
path = "/home/easifem/.config/helix/runtime/queries/cmake"
